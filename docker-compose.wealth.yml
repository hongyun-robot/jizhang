# Opt-in isolated public NAV collector. No database access or host port.
# docker compose -f docker-compose.yml -f docker-compose.wealth.yml --profile wealth up -d --build wealth-collector
services:
  api:
    environment:
      WEALTH_COLLECTOR_URL: http://wealth-collector:8091
      WEALTH_COLLECTOR_KEY: ${WEALTH_COLLECTOR_KEY:-}
    depends_on:
      wealth-collector:
        condition: service_healthy

  wealth-collector:
    profiles: ["app", "wealth"]
    build: ./collector
    container_name: jizhang-wealth-collector
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
      WEALTH_COLLECTOR_KEY: ${WEALTH_COLLECTOR_KEY:?Set a private collector key of at least 24 characters}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/pwuser:size=64m,uid=1001,gid=1001
    shm_size: 256mb
    mem_limit: 1g
    pids_limit: 256
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/playwright-seccomp.json
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
