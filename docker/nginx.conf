# 宿主 nginx 站点样例（容器托管前端时使用）。
#
# 现行方案：独立子域名 jizhang.zhanghongyun.cn，宿主 nginx 终止 TLS 后反代到
# 本机 web 容器（HTTP_BIND=127.0.0.1、HTTP_PORT=8084），复用已有通配证书。
# 容器内 nginx 自己出 dist 并反代 /api/v1/（frontend/nginx.conf），前缀不变。
server {
    listen 80;
    listen [::]:80;
    server_name jizhang.zhanghongyun.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jizhang.zhanghongyun.cn;

    include /etc/nginx/snippets/zhanghongyun-ssl.conf;

    access_log /var/log/nginx/jizhang.zhanghongyun.cn.access.log;
    error_log  /var/log/nginx/jizhang.zhanghongyun.cn.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # CSV 导出是流式下载，关缓冲避免大文件被截断
    proxy_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

