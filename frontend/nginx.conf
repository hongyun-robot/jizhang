# 站点（容器内 nginx）：/ 出前端 dist SPA，/api/v1/ 反代同 compose 网络的 api:8080
# 部署在独立子域名 jizhang.zhanghongyun.cn（宿主 nginx 终止 TLS 后反代到本容器，
# 样例见 docker/nginx.conf）。若改为挂子路径，见 docker/nginx.conf 里的 /jizhang 变体。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 构建产物文件名带 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 入口页不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback：前端路由交给 React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # CSV 导出是流式下载，关缓冲避免大文件截断
        proxy_buffering off;
    }
}
