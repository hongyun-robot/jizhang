<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>记账 · 家庭账本</title>
    <meta
      name="description"
      content="记账：一本全家共用的家庭账本。收支流水、预算进度、资产与统计，纸面账簿式的清爽界面。"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d0c" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="记账" />
    <meta property="og:title" content="记账 · 家庭账本" />
    <meta
      property="og:description"
      content="全家共用的家庭账本：收支流水、预算进度、资产与统计。"
    />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <script>
      // 首屏主题预置（任务 12.1）：在 CSS/JS 加载前按持久化选择或系统配色定 data-theme，
      // 避免刷新时亮暗闪动。逻辑与 src/stores/theme.ts 保持一致。
      (function () {
        try {
          var m = localStorage.getItem('jizhang-theme');
          var dark =
            m === 'dark' ||
            (m !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
